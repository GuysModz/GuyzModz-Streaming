<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player - GuyzModz Stream</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            background: #000;
        }
        .player-page-container {
            max-width: 100vw;
            width: 100vw;
            margin: 0;
            padding: 80px 1rem 1rem 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .player-title-header {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 1rem;
            font-weight: 600;
            transition: var(--transition);
            background: rgba(255,255,255,0.05);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
        }
        .back-btn:hover {
            color: white;
            background: rgba(255,255,255,0.1);
            border-color: var(--primary-color);
        }
        .iframe-container {
            width: 100%;
            flex-grow: 1;
            height: calc(100vh - 170px);
            aspect-ratio: auto;
            border-radius: 0;
            overflow: hidden;
            background: black;
            border: none;
        }
    </style>
</head>
<body>
    <div class="background-effects">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <header class="navbar">
        <div class="logo" onclick="window.location.href='index.html'">
            <i class="fa-solid fa-play"></i> GuyzModz<span>Stream</span>
        </div>
    </header>

    <main class="player-page-container container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
        
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem;">
            <h1 id="page-player-title" class="player-title-header" style="margin-bottom: 0;">Loading Player...</h1>
            <div class="player-options-bar">
                <label for="page-server-select"><i class="fa-solid fa-server"></i> Server:</label>
                <select id="page-server-select" class="server-select">
                    <option value="vidking">Server 1 (VidKing)</option>
                    <option value="vidsrc_cc">Server 2 (VidSrc.cc)</option>
                    <option value="embed2">Server 3 (2Embed)</option>
                </select>
                <button id="page-reload-btn" class="btn btn-secondary btn-small" style="padding: 0.4rem 0.8rem;" title="Reload Stream"><i class="fa-solid fa-rotate-right"></i> Reload</button>
            </div>
        </div>
        
        <div class="iframe-container" id="page-iframe-container">
            <div style="color:var(--text-muted); display:flex; justify-content:center; align-items:center; height:100%; font-size: 1.2rem;">
                <i class="fa-solid fa-spinner fa-spin" style="margin-right: 10px;"></i> Initializing Player...
            </div>
        </div>
        
        <div id="page-tv-controls" class="tv-controls hidden" style="margin-top: 2rem;">
            <div class="control-group">
                <label for="page-season-select">Season:</label>
                <select id="page-season-select">
                    <option>Loading...</option>
                </select>
            </div>
            <div class="control-group">
                <label for="page-episode-select">Episode:</label>
                <select id="page-episode-select">
                    <option>Loading...</option>
                </select>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 GuyzModz Stream. All rights reserved.</p>
        <p class="disclaimer">This site does not store any files on its server. All contents are provided by non-affiliated third parties.</p>
    </footer>

    <script src="player.js"></script>
</body>
</html>
